spring:

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: bookmyvendor-backend

  datasource:
    url: jdbc:postgresql://ep-snowy-mud-aziy5l59.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_4wBe1MpNxtuQ
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# JWT Config
app:
  jwt:
    secret: ${JWT_SECRET:bookmyvendor-super-secret-key-change-in-production-min-256-bits}
    access-token-expiry-ms: 900000       # 15 minutes
    refresh-token-expiry-ms: 604800000   # 7 days

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
    api-key: ${CLOUDINARY_API_KEY:your-api-key}
    api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:your-key-id}
    key-secret: ${RAZORPAY_KEY_SECRET:your-key-secret}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.bookmyvendor: DEBUG
    org.springframework.security: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"







