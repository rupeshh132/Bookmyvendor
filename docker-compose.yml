version: '3.9'

services:
  # ── PostgreSQL Database ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bmv_postgres
    environment:
      POSTGRES_DB: bookmyvendor
      POSTGRES_USER: bookmyvendor
      POSTGRES_PASSWORD: bookmyvendor123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmyvendor -d bookmyvendor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis Cache & Pub/Sub ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bmv_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis Commander (Dev UI for Redis) ─────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: bmv_redis_ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - dev-tools

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: bmv_network
